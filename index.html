<style>
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e2e8f0; --on-ink: #0f172a; --muted: #94a3b8; --paper: #0b1220; --card: #111a2e; --line: #26334d;
    --blue: #38bdf8; --blue-soft: #0c2a3f; --red: #fca5a5; --red-soft: #3b1414; --amber: #fcd34d; --amber-soft: #3a2a0a;
    --green: #86efac; --green-soft: #0f2e1c; --gray: #a8b5c7; --gray-soft: #1b2740; --field: #0e1730;
  }
}
:root[data-theme="dark"] {
  --ink: #e2e8f0; --on-ink: #0f172a; --muted: #94a3b8; --paper: #0b1220; --card: #111a2e; --line: #26334d;
  --blue: #38bdf8; --blue-soft: #0c2a3f; --red: #fca5a5; --red-soft: #3b1414; --amber: #fcd34d; --amber-soft: #3a2a0a;
  --green: #86efac; --green-soft: #0f2e1c; --gray: #a8b5c7; --gray-soft: #1b2740; --field: #0e1730;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; font-family: var(--body); font-size: 1.0625rem; line-height: 1.5; color: var(--ink); background: var(--paper); }
h1, h2, h3 { font-family: var(--head); line-height: 1.15; margin: 0 0 .5rem; }
h1 { font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 800; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 .75rem; }

:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: .92rem; } .center { text-align: center; }

/* Auth */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem 1rem; }
.auth-card { width: 100%; max-width: 440px; background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 1.75rem; box-shadow: 6px 6px 0 var(--ink); }
.auth-card.wide-card { max-width: 760px; }
.brand-big { font-family: var(--head); font-weight: 800; font-size: 1.5rem; margin-bottom: .75rem; color: var(--blue); }
.seg { display: flex; gap: .4rem; margin: 1rem 0; }
.seg button { flex: 1; padding: .55rem; border: 2px solid var(--ink); border-radius: 8px; background: var(--card); font-weight: 700; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--on-ink); }
.fineprint { font-size: .88rem; color: var(--muted); margin-top: 1rem; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem; }
.two form { padding: 1rem; border: 1px solid var(--line); border-radius: 12px; }

/* Forms */
.f { display: block; margin-bottom: .8rem; }
.f > span { display: block; font-weight: 600; font-size: .95rem; margin-bottom: .25rem; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=search], select {
  width: 100%; padding: .6rem .7rem; border: 2px solid var(--line); border-radius: 8px; background: var(--field); min-height: 2.6rem;
}
input:focus, select:focus { border-color: var(--blue); }
.bar-row { display: flex; gap: .5rem; } .bar-row input { flex: 1; }
.hint { font-size: .88rem; color: var(--muted); margin: .3rem 0 0; }
.err { color: var(--red); font-weight: 600; min-height: 1.2em; margin: 0 0 .5rem; }
.two-s { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.chk { display: flex; align-items: center; gap: .55rem; cursor: pointer; }
.chk input { width: 1.2rem; height: 1.2rem; accent-color: var(--blue); }

/* Buttons */
.btn { display: inline-block; padding: .6rem 1.1rem; border: 2px solid var(--ink); border-radius: 8px; background: transparent; font-weight: 700; cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--on-ink); }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.primary:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.wide { width: 100%; }
.danger-btn { border-color: var(--red); color: var(--red); } .danger-btn:hover { background: var(--red); color: var(--card); border-color: var(--red); }
.small-btn { padding: .3rem .7rem; border: 2px solid var(--ink); border-radius: 6px; background: var(--card); font-weight: 700; font-size: .9rem; cursor: pointer; }
.small-btn:hover { background: var(--ink); color: var(--on-ink); }
.small-btn.ghost { border-color: var(--line); } .small-btn.ghost:hover { border-color: var(--ink); }
.small-btn.danger { color: var(--red); } .small-btn.danger:hover { background: var(--red); color: var(--card); border-color: var(--red); }
.link-btn, .linklike { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 700; cursor: pointer; text-align: left; }
.link-btn { text-decoration: underline; } .linklike:hover { text-decoration: underline; }
.row-gap { display: flex; gap: .6rem; flex-wrap: wrap; }

/* Shell */
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { background: var(--card); border-right: 1px solid var(--line); padding: 1.25rem .9rem; position: sticky; top: 0; align-self: start; height: 100vh; }
.brand { font-family: var(--head); font-weight: 800; font-size: 1.5rem; color: var(--blue); margin: 0 0 1.25rem .5rem; }
.side-nav { display: flex; flex-direction: column; gap: .2rem; }
.nav-btn { display: flex; justify-content: space-between; align-items: center; padding: .6rem .75rem; border: 0; border-radius: 8px; background: none; font-weight: 600; cursor: pointer; text-align: left; color: var(--muted); }
.nav-btn:hover { background: var(--blue-soft); color: var(--ink); }
.nav-btn.on { background: var(--ink); color: var(--on-ink); }
.badge { min-width: 1.4rem; padding: 0 .4rem; border-radius: 99px; background: var(--red); color: #fff; font-size: .8rem; text-align: center; margin-left: .4rem; }
.main { min-width: 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem 1.5rem; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar-l, .bar-r { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
.role { background: var(--blue-soft); color: var(--blue); font-weight: 700; font-size: .85rem; padding: .15rem .6rem; border-radius: 99px; }
.view { padding: 1.5rem; max-width: 1100px; }
.bottom { display: none; }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.page-head h1 { margin: 0; }
.lead { max-width: 65ch; }
.sec { margin-top: 2rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .5rem; }
.card-h h2 { margin: 0; } .pad { padding: 1rem 1.25rem; } .pad-top { margin-top: 1.25rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid2 > .card { margin-bottom: 0; } .grid2 { margin-bottom: 1rem; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin-bottom: 1rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; border-top: 5px solid var(--green); }
.stat.amber { border-top-color: var(--amber); } .stat.red { border-top-color: var(--red); }
.stat-l { font-weight: 600; color: var(--muted); margin: 0; font-size: .95rem; }
.stat-n { font-family: var(--head); font-size: 2.1rem; font-weight: 800; line-height: 1.1; margin: .1rem 0; }
.stat-s { color: var(--muted); font-size: .88rem; margin: 0; }
.big-line { font-size: 1.1rem; }
.empty-card { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 2rem; text-align: center; }

/* Item rows */
.ilist, .alist, .slist, .log, .plain-list, .ranked { list-style: none; margin: 0; padding: 0; }
.irow { display: grid; grid-template-columns: minmax(0, 1fr) 6rem 11rem 16.5rem; gap: .75rem; align-items: center; padding: .7rem 1.1rem; border-top: 1px solid var(--line); }
.ilist .irow:first-child { border-top: 0; }
.card:not(.flush) .irow { padding-left: 0; padding-right: 0; }
.iname { min-width: 0; } .iname .linklike { font-size: 1.05rem; color: var(--ink); } .iname small { display: block; color: var(--muted); font-size: .86rem; }
.iqty { font-weight: 600; } .ichips { display: flex; gap: .35rem; flex-wrap: wrap; } .iact { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-block; padding: .15rem .55rem; border-radius: 6px; font-weight: 700; font-size: .84rem; white-space: nowrap; }
.chip.red { background: var(--red-soft); color: var(--red); } .chip.amber { background: var(--amber-soft); color: var(--amber); }
.chip.green { background: var(--green-soft); color: var(--green); } .chip.gray { background: var(--gray-soft); color: var(--gray); }
.ranked .rank-row { display: grid; grid-template-columns: 2.6rem 1fr; align-items: center; border-top: 1px solid var(--line); }
.ranked .rank-row:first-child { border-top: 0; }
.rank { font-family: var(--head); font-weight: 800; font-size: 1.2rem; text-align: center; color: var(--blue); }
.ilist.inner { width: 100%; } .ilist.inner .irow { border-top: 0; padding-left: 0; }
.toolbar { display: flex; gap: .8rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem; }
.toolbar .f { margin-bottom: 0; } .toolbar .grow { flex: 1; min-width: 200px; } .toolbar select { min-width: 9.5rem; }


.grid2 .irow { grid-template-columns: 1fr auto; row-gap: .35rem; }
.grid2 .iqty { text-align: right; } .grid2 .ichips { grid-column: 1 / -1; } .grid2 .iact { grid-column: 1 / -1; justify-content: flex-start; }

/* Alerts, shopping */
.arow { display: flex; gap: .75rem; align-items: center; padding: .55rem 0; border-top: 1px solid var(--line); }
.alist .arow:first-child { border-top: 0; } .alist.full .arow { padding: .75rem 1.25rem; } .arow.unread { background: var(--blue-soft); }
.srow { display: grid; grid-template-columns: minmax(0, 2fr) auto minmax(0, 2fr) auto; gap: .75rem; align-items: center; padding: .7rem 1.25rem; border-top: 1px solid var(--line); }
.slist .srow:first-child { border-top: 0; } .srow.done .sname { text-decoration: line-through; color: var(--muted); }
.sname { font-weight: 600; } .sreason { color: var(--muted); font-size: .9rem; } .unit { color: var(--muted); }
.sqty { width: 5rem; min-height: 2.2rem; padding: .3rem .5rem; border: 2px solid var(--line); border-radius: 6px; background: var(--field); }
.inline-form { display: flex; gap: .8rem; align-items: flex-end; flex-wrap: wrap; } .inline-form .f { margin-bottom: 0; } .inline-form .err { flex-basis: 100%; margin: 0; }

/* Reports */
.legend { display: flex; gap: 1rem; font-size: .9rem; color: var(--muted); margin-bottom: .5rem; } .sw { display: inline-block; width: .8rem; height: .8rem; border-radius: 3px; margin-right: .35rem; } .sw.c, .cbar.c { background: var(--blue); } .sw.w, .cbar.w { background: var(--red); }
.weekly { display: flex; gap: .6rem; align-items: flex-end; height: 190px; padding-top: 1.4rem; }
.wk { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; } .wk small { color: var(--muted); font-size: .8rem; margin-top: .3rem; white-space: nowrap; }
.bars { flex: 1; width: 100%; display: flex; gap: 4px; align-items: flex-end; justify-content: center; border-bottom: 2px solid var(--line); }
.cbar { position: relative; width: 36%; max-width: 28px; border-radius: 4px 4px 0 0; min-height: 2px; } .cbar span { position: absolute; top: -1.25rem; left: 50%; transform: translateX(-50%); font-size: .8rem; font-weight: 700; }
.hb { display: grid; grid-template-columns: 8.5rem 1fr 2rem; gap: .6rem; align-items: center; margin: .35rem 0; font-size: .95rem; } .hn { text-align: right; font-weight: 700; }
.ht { background: var(--gray-soft); border-radius: 99px; height: .7rem; overflow: hidden; } .hf { height: 100%; background: var(--blue); border-radius: 99px; } .hf.red { background: var(--red); } .hf.amber { background: var(--amber); }
.plain-list li { padding: .3rem 0; border-top: 1px solid var(--line); } .plain-list li:first-child { border-top: 0; }

/* Household */
.tablewrap { overflow-x: auto; } table { border-collapse: collapse; width: 100%; min-width: 480px; } th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); }
.code span { font-family: var(--head); font-size: 1.8rem; font-weight: 800; letter-spacing: .2em; margin-right: .75rem; }
.settings { max-width: 440px; } .log li { display: flex; gap: .8rem; padding: .35rem 0; border-top: 1px solid var(--line); font-size: .95rem; } .log li:first-child { border-top: 0; } .log time { color: var(--muted); min-width: 8.5rem; flex-shrink: 0; }
.recipes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; } .recipe { margin: 0; }

/* Modal, toast */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(15, 23, 42, .55); display: grid; place-items: center; padding: 1rem; overflow-y: auto; }
.modal { width: 100%; max-width: 520px; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 1.4rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
.m-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1rem; }
.facts { display: grid; grid-template-columns: 9rem 1fr; gap: .35rem .8rem; margin: 0 0 1rem; } .facts dt { color: var(--muted); font-weight: 600; } .facts dd { margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--on-ink); padding: .7rem 1.1rem; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 40; max-width: calc(100vw - 2rem); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }


@media (max-width: 1180px) {
  .irow { grid-template-columns: 1fr auto; row-gap: .35rem; }
  .irow .iqty { text-align: right; } .irow .ichips { grid-column: 1 / -1; } .irow .iact { grid-column: 1 / -1; justify-content: flex-start; }
}

/* Mobile */
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; padding-bottom: 4.5rem; } .side { display: none; }
  .bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--card); border-top: 1px solid var(--line); padding: .35rem .4rem calc(.35rem + env(safe-area-inset-bottom, 0px)); overflow-x: auto; gap: .2rem; }
  .bottom .nav-btn { flex: 0 0 auto; justify-content: center; font-size: .9rem; padding: .5rem .7rem; white-space: nowrap; }
  .bar { padding: .6rem 1rem; } .who { display: none; } .view { padding: 1rem; }
  .stats { grid-template-columns: 1fr 1fr; } .grid2, .recipes, .two, .two-s { grid-template-columns: 1fr; }
  .irow { grid-template-columns: 1fr auto; row-gap: .35rem; } .iname { grid-column: 1; } .iqty { grid-column: 2; text-align: right; } .ichips { grid-column: 1 / -1; } .iact { grid-column: 1 / -1; justify-content: flex-start; }
  .srow { grid-template-columns: 1fr auto; } .sreason { grid-column: 1 / -1; } .iact { justify-content: flex-start; }
  .hb { grid-template-columns: 6.5rem 1fr 1.8rem; } .toast { bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ===== v2 additions ===== */
.glance { background: var(--blue-soft); border-radius: 10px; padding: .75rem 1rem; margin-bottom: 1rem; }
.money { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.money-n { font-family: var(--head); font-size: 1.9rem; font-weight: 800; line-height: 1.15; margin: 0; } .money-n.warn { color: var(--red); }
.budget { margin-top: 1rem; } .budget-top { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .3rem; font-size: .95rem; }

.sreason { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.iact.start { justify-content: flex-start; margin-top: .5rem; }
.f.inline { display: inline-block; margin: 0 0 1rem; } .f.inline select { min-width: 12rem; } .card-h .f.inline { margin: 0; }

.toast.act { pointer-events: auto; }

.scanbox { margin-top: .5rem; } .scanbox video { width: 100%; max-height: 220px; border-radius: 10px; background: #000; object-fit: cover; }
textarea.bk { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; padding: .6rem; border: 2px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); resize: vertical; }
.mt { margin-top: 1rem; }
td.pos { color: var(--green); font-weight: 700; } td.neg { color: var(--red); font-weight: 700; }

.weekly.short { height: 150px; } .cbar.wide { width: 50%; max-width: 40px; }

/* Large text mode (easy reading for elderly users) */

@media (max-width: 860px) { .money { grid-template-columns: 1fr; } .f.inline select { min-width: 0; width: 100%; } .f.inline { display: block; } }

/* fixes */
input.sqty { width: 5rem; min-height: 2.2rem; padding: .3rem .5rem; }
.btn { color: var(--ink); text-decoration: none; }
.btn.primary { color: var(--on-ink); } .btn.primary:hover { color: #fff; } .btn:hover { color: var(--on-ink); }

.nav-btn svg { flex-shrink: 0; } .nav-btn .nl { flex: 1; text-align: left; }
.role.sys { background: var(--ink); color: var(--on-ink); }

.approve.ok { background: var(--green-soft); color: var(--green); } .approve.warn { background: var(--amber-soft); color: var(--amber); }

<div id="app"></div>

<script>
/*
 UseFirst prototype. Code is organised the way the case study describes it (slide 5):
 separate Inventory, Alerts, Shopping and Analytics logic, with the UI layer kept apart.
   Storage and security : load/save, migrate, password hashing (PBKDF2), roles (perms)
   Inventory            : item status, Use-First ranking (FEFO), use/waste/share, shelf life
   Alerts               : rawAlerts, deriveAlerts, mark resolved, per-person alert choices
   Shopping             : smart list, approval, shared expenses
   Analytics            : usage model, money, report data, system checks (NFR1, NFR4, NFR8)
   UI layer             : everything after "UI state" only calls the functions above
*/
(function () {
'use strict';

/* ================= Storage ================= */
const KEY = 'usefirst.app.v1';
let DB = { users: [], households: [], session: null };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.users) && Array.isArray(p.households)) DB = p; }
} catch (e) { /* storage unavailable: app still works for this visit */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ } }
function migrate() {
  DB.households.forEach(h => {
    h.settings = h.settings || {};
    if (h.settings.budget == null) h.settings.budget = 0;
    if (h.settings.alertDays == null) h.settings.alertDays = 3;
    if (h.settings.autoList == null) h.settings.autoList = true;
    if (!h.settings.source) h.settings.source = 'catalog';
    h.expenses = h.expenses || []; h.read = h.read || {}; h.shopping = h.shopping || []; h.log = h.log || []; h.items = h.items || [];
  });
  DB.users.forEach(u => {
    u.pref = u.pref || {};
    if (u.pref.large == null) u.pref.large = false;
    if (u.pref.notify == null) u.pref.notify = false;
    u.pref.alerts = Object.assign({ expired: true, soon: true, low: true, out: true }, u.pref.alerts || {});
  });
  DB.syslog = DB.syslog || []; DB.catalog = DB.catalog || [];
  DB.config = DB.config || { source: (DB.households[0] && DB.households[0].settings && DB.households[0].settings.source) || 'catalog' };
  DB.households.forEach(h => { h.resolved = h.resolved || {}; if (h.approval === undefined) h.approval = null; });
  if (DB.users.length && !DB.users.some(x => x.sysAdmin)) DB.users[0].sysAdmin = true;
}
migrate();

/* ================= Helpers ================= */
const DAY = 864e5;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtQty(n) { return String(parseFloat(Number(n).toFixed(2))); }
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseD(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function plusDays(n) { const d = startOfToday(); d.setDate(d.getDate() + n); return iso(d); }
function daysLeft(s) { return s ? Math.round((parseD(s) - startOfToday()) / DAY) : null; }
function fmtDate(s) { return s ? parseD(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
function fmtTime(t) { return new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function fmtMoney(n) { n = Math.round((Number(n) || 0) * 100) / 100; return '\u20B9' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
async function sha(text) {
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
  return 'weak' + h;
}

function hex(buf) { return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join(''); }
// Password storage: salted PBKDF2 (SHA-256, 150,000 rounds). Older accounts used a single SHA-256 and are upgraded at next sign-in.
async function kdf(pw, salt) {
  if (window.crypto && crypto.subtle && crypto.subtle.importKey) {
    try {
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 150000, hash: 'SHA-256' }, key, 256);
      return 'p1$' + hex(bits);
    } catch (e) { /* fall back below */ }
  }
  return 'w$' + await sha(salt + pw);
}
async function checkPw(user, pw) {
  if (user.hash.indexOf('p1$') === 0 || user.hash.indexOf('w$') === 0) return (await kdf(pw, user.salt)) === user.hash;
  return (await sha(user.salt + pw)) === user.hash;
}
function syslog(who, text) { DB.syslog.unshift({ t: new Date().toISOString(), who: who, text: text }); if (DB.syslog.length > 300) DB.syslog.length = 300; }

/* ================= Reference data ================= */
const CATEGORIES = ['Dairy', 'Vegetables', 'Fruits', 'Bakery', 'Grains & flour', 'Pulses', 'Meat & eggs', 'Snacks', 'Beverages', 'Oil & spices', 'Other'];
const UNITS = ['pcs', 'kg', 'g', 'L', 'ml', 'pack'];
const LOCATIONS = ['Fridge', 'Freezer', 'Pantry', 'Counter', 'Other'];
const ROLE_LABEL = { manager: 'Home Manager', member: 'Household Member', viewer: 'Viewer' };
// Sample barcode catalog (stands in for a real product database). shelf = days until expiry, 0 = no expiry.
const CATALOG = {
  '8900000000011': { name: 'Milk', category: 'Dairy', unit: 'L', qty: 1, location: 'Fridge', shelf: 4, min: 1 },
  '8900000000028': { name: 'Curd', category: 'Dairy', unit: 'pack', qty: 1, location: 'Fridge', shelf: 6, min: 1 },
  '8900000000035': { name: 'Paneer', category: 'Dairy', unit: 'pack', qty: 1, location: 'Fridge', shelf: 7, min: 0 },
  '8900000000042': { name: 'Bread', category: 'Bakery', unit: 'pack', qty: 1, location: 'Counter', shelf: 4, min: 1 },
  '8900000000059': { name: 'Eggs', category: 'Meat & eggs', unit: 'pcs', qty: 12, location: 'Fridge', shelf: 14, min: 4 },
  '8900000000066': { name: 'Butter', category: 'Dairy', unit: 'pack', qty: 1, location: 'Fridge', shelf: 60, min: 1 },
  '8900000000073': { name: 'Basmati Rice', category: 'Grains & flour', unit: 'kg', qty: 5, location: 'Pantry', shelf: 0, min: 1 },
  '8900000000080': { name: 'Wheat Flour (Atta)', category: 'Grains & flour', unit: 'kg', qty: 5, location: 'Pantry', shelf: 0, min: 1 },
  '8900000000097': { name: 'Toor Dal', category: 'Pulses', unit: 'kg', qty: 1, location: 'Pantry', shelf: 0, min: 0.5 },
  '8900000000103': { name: 'Tomato', category: 'Vegetables', unit: 'kg', qty: 1, location: 'Counter', shelf: 6, min: 0.5 },
  '8900000000110': { name: 'Onion', category: 'Vegetables', unit: 'kg', qty: 2, location: 'Pantry', shelf: 20, min: 1 },
  '8900000000127': { name: 'Potato', category: 'Vegetables', unit: 'kg', qty: 2, location: 'Pantry', shelf: 25, min: 1 },
  '8900000000134': { name: 'Spinach', category: 'Vegetables', unit: 'pack', qty: 1, location: 'Fridge', shelf: 3, min: 0 },
  '8900000000141': { name: 'Banana', category: 'Fruits', unit: 'pcs', qty: 6, location: 'Counter', shelf: 4, min: 0 },
  '8900000000158': { name: 'Apple', category: 'Fruits', unit: 'pcs', qty: 4, location: 'Fridge', shelf: 14, min: 0 },
  '8900000000165': { name: 'Cooking Oil', category: 'Oil & spices', unit: 'L', qty: 1, location: 'Pantry', shelf: 0, min: 0.5 },
  '8900000000172': { name: 'Tea Powder', category: 'Beverages', unit: 'pack', qty: 1, location: 'Pantry', shelf: 0, min: 1 }
};
function findProduct(code) { const c = (DB.catalog || []).find(x => x.code === code); return c || CATALOG[code] || null; }
function barcodeSource() { return (DB.config && DB.config.source) || 'catalog'; }
const RECIPES = [
  { name: 'French toast', time: 15, uses: ['bread', 'egg', 'milk'], tip: 'Whisk eggs with milk, dip the slices and pan-fry until golden.' },
  { name: 'Paneer bhurji', time: 15, uses: ['paneer', 'onion', 'tomato'], tip: 'Saute onion and tomato, crumble in the paneer, add spices.' },
  { name: 'Palak paneer', time: 30, uses: ['spinach', 'paneer', 'onion'], tip: 'Blanch and blend the spinach, cook with onion, add paneer cubes.' },
  { name: 'Spinach dal', time: 30, uses: ['spinach', 'dal', 'tomato'], tip: 'Pressure-cook the dal, stir in wilted spinach, finish with a garlic tadka.' },
  { name: 'Curd rice', time: 10, uses: ['curd', 'rice'], tip: 'Mix cooked rice with curd and salt, top with a mustard tadka.' },
  { name: 'Kheer', time: 35, uses: ['milk', 'rice'], tip: 'Simmer rice in milk until creamy, sweeten and add cardamom.' },
  { name: 'Vegetable sandwich', time: 10, uses: ['bread', 'tomato', 'onion', 'butter'], tip: 'Layer sliced vegetables between buttered bread and toast it.' },
  { name: 'Egg curry', time: 25, uses: ['egg', 'onion', 'tomato'], tip: 'Make an onion-tomato masala and simmer boiled eggs in it.' },
  { name: 'Aloo paratha', time: 30, uses: ['potato', 'flour', 'curd', 'butter'], tip: 'Stuff spiced mashed potato into atta dough and roast with butter.' },
  { name: 'Banana smoothie', time: 5, uses: ['banana', 'milk', 'curd'], tip: 'Blend ripe bananas with chilled milk or curd.' },
  { name: 'Fruit salad', time: 10, uses: ['apple', 'banana'], tip: 'Chop the fruit, add lemon juice and a pinch of chaat masala.' },
  { name: 'Tomato soup', time: 25, uses: ['tomato', 'onion', 'butter', 'bread'], tip: 'Simmer tomato and onion, blend, finish with butter, serve with toast.' }
];

/* ================= Current user / permissions ================= */
function curUser() { return DB.users.find(u => u.id === DB.session) || null; }
function curHH(u) { return u ? (DB.households.find(h => h.id === u.householdId) || null) : null; }
function perms(u) {
  const r = u.role;
  return { inv: r === 'manager', use: r === 'manager' || r === 'member', list: r === 'manager', reports: r === 'manager', admin: r === 'manager', sys: !!u.sysAdmin };
}

/* ================= Item status ================= */
const isOut = it => it.qty <= 0;
const isExpired = it => { const d = daysLeft(it.expiry); return it.qty > 0 && d !== null && d < 0; };
const isSoon = (h, it) => { const d = daysLeft(it.expiry); return it.qty > 0 && d !== null && d >= 0 && d <= h.settings.alertDays; };
const isLow = it => it.qty > 0 && it.min > 0 && it.qty <= it.min;
function cmpExpiry(a, b) {
  const ea = a.expiry || '9999-12-31', eb = b.expiry || '9999-12-31';
  if (ea !== eb) return ea < eb ? -1 : 1;
  return (a.addedOn || '') < (b.addedOn || '') ? -1 : 1;
}
function useFirstList(h) { return h.items.filter(i => i.qty > 0).sort(cmpExpiry); }

/* ================= Alerts (derived from stock, never stale) ================= */
function lastUseId(h, it) { const e = h.log.find(x => x.itemId === it.id && (x.type === 'consumed' || x.type === 'wasted' || x.type === 'donated')); return e ? e.id : '0'; }
function rawAlerts(h) {
  const out = [];
  h.items.forEach(it => {
    const d = daysLeft(it.expiry);
    const q = fmtQty(it.qty) + ' ' + it.unit;
    if (isOut(it)) out.push({ key: 'out:' + it.id + ':' + lastUseId(h, it), type: 'out', sev: 2, itemId: it.id, msg: it.name + ' is out of stock' });
    else if (isExpired(it)) out.push({ key: 'exp:' + it.id + ':' + it.expiry, type: 'expired', sev: 3, itemId: it.id, msg: it.name + ' expired ' + (-d) + (d === -1 ? ' day' : ' days') + ' ago (' + q + ' left)' });
    else if (isSoon(h, it)) out.push({ key: 'soon:' + it.id + ':' + it.expiry, type: 'soon', sev: d <= 1 ? 3 : 2, itemId: it.id, days: d, msg: it.name + (d === 0 ? ' expires today' : d === 1 ? ' expires tomorrow' : ' expires in ' + d + ' days') + ' (' + q + ')' });
    if (isLow(it)) out.push({ key: 'low:' + it.id + ':' + fmtQty(it.qty), type: 'low', sev: 1, itemId: it.id, msg: it.name + ' is running low (' + q + ' left, minimum ' + fmtQty(it.min) + ')' });
  });
  return out.sort((a, b) => b.sev - a.sev || (a.days || 0) - (b.days || 0));
}
function readKeys(h, u) { return (h.read && h.read[u.id]) || []; }
function deriveAlerts(h) { const r = h.resolved || {}; return rawAlerts(h).filter(a => !r[a.key]); }
function resolvedAlerts(h) { const r = h.resolved || {}; return rawAlerts(h).filter(a => r[a.key]); }
function userAlerts(h, u) { const pr = (u && u.pref && u.pref.alerts) || {}; return deriveAlerts(h).filter(a => pr[a.type] !== false); }
function unreadCount(h, u) { const r = readKeys(h, u); return userAlerts(h, u).filter(a => r.indexOf(a.key) < 0).length; }

/* ================= Activity log ================= */
function addLog(h, u, type, it, qty, note, cost) {
  const e = { id: uid(), t: new Date().toISOString(), userId: u ? u.id : null, userName: u ? u.name : 'System', type: type, itemId: it ? it.id : null, itemName: it ? it.name : '', qty: qty || 0, unit: it ? it.unit : '', note: note || '', cost: cost || 0 };
  h.log.unshift(e);
  if (h.log.length > 600) h.log.length = 600;
  return e;
}
function logText(e) {
  const q = e.qty ? fmtQty(e.qty) + ' ' + e.unit + ' of ' : '';
  switch (e.type) {
    case 'added': return 'added ' + e.itemName + (e.qty ? ' (' + fmtQty(e.qty) + ' ' + e.unit + ')' : '');
    case 'restocked': return 'restocked ' + e.itemName + (e.qty ? ' (' + fmtQty(e.qty) + ' ' + e.unit + ')' : '');
    case 'consumed': return 'used ' + q + e.itemName;
    case 'wasted': return 'threw away ' + q + e.itemName;
    case 'donated': return 'shared ' + q + e.itemName + ' with others';
    case 'edited': return 'edited ' + e.itemName;
    case 'removed': return 'removed ' + e.itemName;
    default: return e.note || e.type;
  }
}
function itemHistory(h, it) {
  return h.log.filter(e => e.itemId === it.id || (!e.itemId && e.itemName && e.itemName.toLowerCase() === it.name.toLowerCase()));
}

/* ================= Usage patterns, smart list ================= */
function usedSince(h, name, days, kinds) {
  const from = Date.now() - days * DAY, n = name.toLowerCase();
  return h.log.reduce((s, e) => (kinds.indexOf(e.type) >= 0 && e.itemName.toLowerCase() === n && new Date(e.t).getTime() >= from) ? s + e.qty : s, 0);
}
function dailyUse(h, it) { return usedSince(h, it.name, 28, ['consumed']) / 28; }
function usageModel(h, it) { const perWeek = usedSince(h, it.name, 28, ['consumed']) / 4, perDay = perWeek / 7; return { perWeek: perWeek, days: (perDay > 0 && it.qty > 0) ? it.qty / perDay : null }; }
function suggestQty(h, it) {
  const perWeek = usedSince(h, it.name, 28, ['consumed', 'wasted']) / 4;
  let q = perWeek > 0 ? perWeek : Math.max((it.min || 0) * 2, 1);
  return (it.unit === 'pcs' || it.unit === 'pack') ? Math.ceil(q) : Math.ceil(q * 2) / 2;
}
function onList(h, name) { return h.shopping.some(s => !s.done && s.name.toLowerCase() === name.toLowerCase()); }
function autoAdd(h, it, reason) {
  if (onList(h, it.name)) return null;
  const s = { id: uid(), name: it.name, qty: suggestQty(h, it), unit: it.unit, reason: reason, done: false, auto: true, assignee: '' };
  h.shopping.push(s);
  return s;
}
function generateList(h) {
  let n = 0;
  h.items.forEach(it => {
    if (onList(h, it.name)) return;
    let reason = null;
    if (isOut(it)) reason = 'Out of stock';
    else if (isExpired(it)) reason = 'Expired, needs replacing';
    else if (isLow(it)) reason = 'Low stock (' + fmtQty(it.qty) + ' ' + it.unit + ' left)';
    else { const r = dailyUse(h, it); if (r > 0 && it.qty / r < 3) reason = 'Runs out in about ' + Math.max(1, Math.round(it.qty / r)) + ' day(s) at your usual use'; }
    if (reason) { h.shopping.push({ id: uid(), name: it.name, qty: suggestQty(h, it), unit: it.unit, reason: reason, done: false, auto: true, assignee: '' }); n++; }
  });
  return n;
}

/* ================= Shopping list approval (usage scenario step 10) ================= */
function listSig(h) { return h.shopping.filter(s => !s.done).map(s => s.id + ':' + fmtQty(s.qty)).sort().join('|'); }
function approvalState(h) {
  const n = h.shopping.filter(s => !s.done).length;
  if (!n) return 'none';
  if (!h.approval) return 'pending';
  return h.approval.sig === listSig(h) ? 'approved' : 'stale';
}
function approveList(h, u) {
  const n = h.shopping.filter(s => !s.done).length; if (!n) return false;
  h.approval = { sig: listSig(h), by: u.id, name: u.name, t: new Date().toISOString() };
  addLog(h, u, 'approved', null, 0, 'approved the shopping list (' + n + (n === 1 ? ' item' : ' items') + ') for the next store visit');
  save(); return true;
}

/* ================= Use / waste ================= */
function useItem(h, u, id, amount, kind, note) {
  const it = h.items.find(i => i.id === id);
  if (!it) return { err: 'Item not found.' };
  amount = Number(amount);
  if (!(amount > 0)) return { err: 'Enter an amount above 0.' };
  if (amount > it.qty + 1e-9) return { err: 'You only have ' + fmtQty(it.qty) + ' ' + it.unit + '.' };
  const cost = amount * (Number(it.unitPrice) || 0);
  it.qty = Math.round((it.qty - amount) * 1000) / 1000;
  const entry = addLog(h, u, kind, it, amount, note, cost);
  const verb = kind === 'wasted' ? 'Recorded waste: ' : kind === 'donated' ? 'Recorded sharing: ' : 'Recorded use: ';
  let msg = verb + fmtQty(amount) + ' ' + it.unit + ' of ' + it.name + '.', shopId = null;
  if (h.settings.autoList && (it.qty <= 0 || (it.min > 0 && it.qty <= it.min))) {
    const s = autoAdd(h, it, it.qty <= 0 ? 'Finished after use' : 'Below minimum stock');
    if (s) { shopId = s.id; msg += ' Added to the shopping list.'; }
  }
  save();
  return { ok: true, msg: msg, undo: { itemId: it.id, amount: amount, logId: entry.id, shopId: shopId } };
}
function undoUse(h, undo) {
  const it = h.items.find(i => i.id === undo.itemId);
  if (!it) return false;
  it.qty = Math.round((it.qty + undo.amount) * 1000) / 1000;
  h.log = h.log.filter(e => e.id !== undo.logId);
  if (undo.shopId) h.shopping = h.shopping.filter(s => s.id !== undo.shopId);
  save();
  return true;
}

/* ================= Money, tips, shelf life, split ================= */
const itemValue = it => Math.max(0, it.qty) * (Number(it.unitPrice) || 0);
function moneyAtRisk(h) { return h.items.filter(i => isExpired(i) || isSoon(h, i)).reduce((s, i) => s + itemValue(i), 0); }
function monthStartMs() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
function spendThisMonth(h) { const m = monthStartMs(); return h.expenses.reduce((s, e) => new Date(e.t).getTime() >= m ? s + e.amount : s, 0); }
function costSince(h, type, days) { const from = Date.now() - days * DAY; return h.log.reduce((s, e) => (e.type === type && new Date(e.t).getTime() >= from) ? s + (e.cost || 0) : s, 0); }
const SAVE_TIPS = [
  { k: 'milk', tip: 'Boil it and make tea, kheer or paneer today.' },
  { k: 'curd', tip: 'Turn it into buttermilk (chaas) or kadhi.' },
  { k: 'paneer', tip: 'Cook bhurji today, or cube it and freeze it in a closed box.' },
  { k: 'bread', tip: 'Freeze the slices and toast them straight from the freezer.' },
  { k: 'banana', tip: 'Peel and freeze for smoothies, or bake banana bread.' },
  { k: 'spinach', tip: 'Cook palak today, or blanch for a minute and freeze.' },
  { k: 'tomato', tip: 'Cook into puree and freeze it in small portions.' },
  { k: 'egg', tip: 'Hard-boil them. Boiled eggs keep for about a week in the fridge.' },
  { k: 'apple', tip: 'Slice into a fruit salad or stew with a little sugar.' }
];
function saveTip(it) {
  const n = it.name.toLowerCase();
  const hit = SAVE_TIPS.find(t => n.indexOf(t.k) >= 0);
  if (hit) return hit.tip;
  if (it.category === 'Vegetables') return 'Cook it into a sabzi or soup today.';
  if (it.category === 'Fruits') return 'Eat it today or blend it into a smoothie.';
  if (it.category === 'Dairy') return 'Use it today, or share it with a neighbour.';
  return 'Cook it soon, or share it while it is still fresh.';
}
// Conservative typical shelf life in days. It is an estimate, so always check the pack.
const SHELF = {
  'Dairy': { Fridge: 5, Freezer: 60, Counter: 1, Pantry: 1, Other: 2 },
  'Vegetables': { Fridge: 7, Counter: 4, Pantry: 14, Freezer: 90, Other: 4 },
  'Fruits': { Fridge: 10, Counter: 4, Pantry: 4, Freezer: 90, Other: 4 },
  'Bakery': { Counter: 3, Pantry: 3, Fridge: 6, Freezer: 60, Other: 3 },
  'Meat & eggs': { Fridge: 3, Freezer: 90, Counter: 1, Pantry: 1, Other: 1 },
  'Snacks': { Pantry: 60, Counter: 60, Fridge: 90, Freezer: 90, Other: 60 },
  'Grains & flour': { Pantry: 180, Counter: 180, Fridge: 180, Freezer: 180, Other: 180 },
  'Pulses': { Pantry: 180, Counter: 180, Fridge: 180, Freezer: 180, Other: 180 },
  'Oil & spices': { Pantry: 180, Counter: 180, Fridge: 180, Freezer: 180, Other: 180 },
  'Beverages': { Pantry: 120, Counter: 120, Fridge: 120, Freezer: 120, Other: 120 }
};
function typicalDays(category, location) { const c = SHELF[category]; return c ? (c[location] || null) : null; }
function ledger(h) {
  const members = DB.users.filter(x => x.householdId === h.id && x.role !== 'viewer');
  const ids = members.map(m => m.id);
  const open = h.expenses.filter(e => !e.settled && ids.indexOf(e.userId) >= 0);
  const total = open.reduce((s, e) => s + e.amount, 0);
  const share = members.length ? total / members.length : 0;
  const paid = {}; open.forEach(e => { paid[e.userId] = (paid[e.userId] || 0) + e.amount; });
  const rows = members.map(m => ({ m: m, paid: paid[m.id] || 0, bal: (paid[m.id] || 0) - share }));
  const cred = rows.filter(r => r.bal > 0.5).map(r => ({ m: r.m, a: r.bal })).sort((a, b) => b.a - a.a);
  const debt = rows.filter(r => r.bal < -0.5).map(r => ({ m: r.m, a: -r.bal })).sort((a, b) => b.a - a.a);
  const pay = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const x = Math.min(debt[i].a, cred[j].a);
    pay.push({ from: debt[i].m, to: cred[j].m, amount: x });
    debt[i].a -= x; cred[j].a -= x;
    if (debt[i].a < 0.5) i++;
    if (cred[j].a < 0.5) j++;
  }
  return { members: members, open: open, total: total, share: share, rows: rows, pay: pay };
}

function makeBackup(h) {
  return JSON.stringify({ app: 'usefirst', version: 2, exported: new Date().toISOString(), household: { name: h.name, settings: h.settings, items: h.items, log: h.log, shopping: h.shopping, expenses: h.expenses } }, null, 1);
}
function applyBackup(h, u, text) {
  let d; try { d = JSON.parse(text); } catch (e) { return 'That text is not a valid backup. Paste the whole backup text.'; }
  const b = d && d.app === 'usefirst' && d.household;
  if (!b || !Array.isArray(b.items) || !Array.isArray(b.log) || !Array.isArray(b.shopping)) return 'This does not look like a UseFirst backup.';
  const okItem = i => i && typeof i.name === 'string' && typeof i.qty === 'number' && typeof i.unit === 'string' && typeof i.id === 'string';
  if (!b.items.every(okItem)) return 'Some items in the backup are damaged, so nothing was restored.';
  h.items = b.items.map(i => ({ id: i.id, name: i.name, category: i.category || 'Other', unit: i.unit, qty: i.qty, location: i.location || 'Other', expiry: i.expiry || '', min: Number(i.min) || 0, barcode: i.barcode || '', addedOn: i.addedOn || plusDays(0), unitPrice: Number(i.unitPrice) || 0 }));
  h.log = b.log.filter(e => e && typeof e.t === 'string' && typeof e.type === 'string').slice(0, 600);
  h.shopping = b.shopping.filter(s => s && typeof s.name === 'string').map(s => ({ id: s.id || uid(), name: s.name, qty: Number(s.qty) || 1, unit: s.unit || 'pcs', reason: s.reason || '', done: !!s.done, auto: !!s.auto, assignee: s.assignee || '' }));
  h.expenses = Array.isArray(b.expenses) ? b.expenses.filter(e => e && typeof e.amount === 'number') : [];
  if (b.settings) {
    h.settings.alertDays = Math.min(14, Math.max(1, Number(b.settings.alertDays) || 3));
    h.settings.budget = Number(b.settings.budget) || 0;
    h.settings.autoList = b.settings.autoList !== false;
  }
  addLog(h, u, 'seed', null, 0, 'restored data from a backup');
  save();
  return null;
}

/* ================= Recipes ================= */
function recipeIdeas(h) {
  const stock = h.items.filter(i => i.qty > 0 && !isExpired(i));
  const res = [];
  RECIPES.forEach(r => {
    const found = [], missing = [];
    r.uses.forEach(k => {
      const it = stock.find(i => i.name.toLowerCase().indexOf(k) >= 0);
      if (it) { if (found.indexOf(it) < 0) found.push(it); } else missing.push(k);
    });
    if (found.length < 2) return;
    const urgent = found.filter(i => { const d = daysLeft(i.expiry); return d !== null && d <= h.settings.alertDays; });
    const score = urgent.length * 3 + found.length * 0.1 - missing.length * 0.05;
    res.push({ r: r, found: found, missing: missing, urgent: urgent, score: score });
  });
  return res.sort((a, b) => b.score - a.score).slice(0, 4);
}

function alertAccuracy(h) {
  let total = 0, good = 0;
  const raw = rawAlerts(h);
  const midnight = new Date(new Date().toDateString()).getTime();
  h.items.forEach(it => {
    const exp = {};
    const days = it.expiry ? Math.round((new Date(it.expiry + 'T00:00:00').getTime() - midnight) / DAY) : null;
    if (it.qty <= 0) exp.out = 1;
    else {
      if (days !== null && days < 0) exp.expired = 1; else if (days !== null && days <= h.settings.alertDays) exp.soon = 1;
      if (it.min > 0 && it.qty <= it.min) exp.low = 1;
    }
    const got = {}; raw.filter(a => a.itemId === it.id).forEach(a => { got[a.type] = 1; });
    const ek = Object.keys(exp), gk = Object.keys(got);
    total++; if (ek.length === gk.length && ek.every(k => got[k])) good++;
  });
  return { total: total, good: good };
}
function dataProblems(h) {
  const p = [], ids = {};
  h.items.forEach(i => {
    if (ids[i.id]) p.push('duplicate item id for ' + i.name); ids[i.id] = 1;
    if (!i.name || !i.unit) p.push('an item has no name or unit');
    if (!isFinite(i.qty) || i.qty < 0) p.push(i.name + ' has an invalid quantity');
    if (i.expiry && !/^\d{4}-\d{2}-\d{2}$/.test(i.expiry)) p.push(i.name + ' has an invalid expiry date');
  });
  h.shopping.forEach(s => { if (!(s.qty > 0)) p.push('shopping item ' + s.name + ' has an invalid quantity'); });
  h.expenses.forEach(e => { if (!(e.amount > 0)) p.push('expense ' + e.itemName + ' has an invalid amount'); });
  h.log.forEach(e => { if (isNaN(new Date(e.t).getTime())) p.push('a log entry has an invalid date'); });
  return p;
}

  const stock = h.items.filter(i => i.qty > 0);

    '<div class="grid2">' +

function consumptionChart(h) {
  const from = Date.now() - 56 * DAY, tot = {};
  h.log.forEach(e => { if (e.type === 'consumed' && new Date(e.t).getTime() >= from) tot[e.itemName] = (tot[e.itemName] || 0) + e.qty; });
  const names = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
  if (!names.length) return '<section class="card"><h2>Consumption chart</h2><p class="muted">Record some use and a weekly chart for each item will appear here.</p></section>';
  if (!UI.chartItem || names.indexOf(UI.chartItem) < 0) UI.chartItem = names[0];
  const name = UI.chartItem, unit = (h.log.find(e => e.itemName === name && e.unit) || {}).unit || '';
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const end = startOfToday().getTime() + DAY - i * 7 * DAY, start = end - 7 * DAY; let q = 0;
    h.log.forEach(e => { const t = new Date(e.t).getTime(); if (e.type === 'consumed' && e.itemName === name && t >= start && t < end) q += e.qty; });
    weeks.push({ label: new Date(start).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }), q: q });
  }
  const max = Math.max.apply(null, [0.0001].concat(weeks.map(w => w.q))), avg = weeks.reduce((s, w) => s + w.q, 0) / 8;
  return '<section class="card"><div class="card-h"><h2>Consumption chart</h2><label class="f inline"><span>Item</span><select id="chartItem">' + names.map(n => '<option' + (n === name ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></label></div>' +
    '<p class="muted small">About ' + fmtQty(avg) + ' ' + esc(unit) + ' per week over the last 8 weeks.</p>' +
    '<div class="weekly short" role="img" aria-label="Weekly use of ' + esc(name) + ': ' + weeks.map(w => w.label + ' ' + fmtQty(w.q) + ' ' + unit).join('; ') + '">' +
    weeks.map(w => '<div class="wk"><div class="bars"><div class="cbar c wide" style="height:' + Math.round(w.q / max * 100) + '%"><span>' + fmtQty(w.q) + '</span></div></div><small>' + w.label + '</small></div>').join('') + '</div></section>';
}

    if (!name) return ferr(f, 'Enter a name for the item.');

    if (!(min >= 0)) return ferr(f, 'Alert level cannot be negative.');

    const rec = { name: name, category: fd.get('category'), barcode: (fd.get('barcode') || '').trim(), qty: qty, unit: fd.get('unit'), expiry: fd.get('expiry') || '', location: fd.get('location'), min: min, unitPrice: price };

    h.resolved[key] = { by: u.id, name: u.name, t: new Date().toISOString() };
    addLog(h, u, 'resolved', null, 0, 'marked an alert as resolved: ' + a.msg); save(); render();
    toast('Alert marked as resolved.', { label: 'Undo', fn: () => { const hh = curHH(curUser()); if (hh) { delete hh.resolved[key]; save(); render(); } } });
  },
  reopenAlert(el) { const u = curUser(), h = curHH(u); if (!perms(u).use) return; delete h.resolved[el.dataset.key]; save(); render(); toast('Alert reopened.'); },
  askRemoveUser(el) { const m = DB.users.find(x => x.id === el.dataset.id); UI.modal = { type: 'confirm', title: 'Remove this account?', text: (m ? m.name : 'This person') + ' will no longer be able to sign in. Their history stays in the household log.', yes: 'removeUser', arg: el.dataset.id, label: 'Remove account' }; render(); },
  delProduct(el) { const u = curUser(); if (!perms(u).sys) return; DB.catalog = DB.catalog.filter(x => x.code !== el.dataset.code); syslog(u.name, 'removed product ' + el.dataset.code + ' from the data source'); save(); render(); },
  runHealth() {
    const u = curUser(); if (!perms(u).sys) return;
    let slowest = 0, tot = 0, good = 0; const probs = [];
    DB.households.forEach(h => {
      const t0 = performance.now(); viewDashboard(u, h); slowest = Math.max(slowest, performance.now() - t0);
      const a = alertAccuracy(h); tot += a.total; good += a.good;
      dataProblems(h).forEach(x => probs.push(h.name + ': ' + x));
    });
    const rows = [
      { id: 'NFR1', check: 'Dashboard refresh time', target: 'under 2 seconds', result: DB.households.length ? Math.round(slowest) + ' ms (slowest household)' : 'No households yet', ok: slowest < 2000 },
      { id: 'NFR4', check: 'Alert accuracy', target: '99.9% or better', result: tot ? (good / tot * 100).toFixed(1) + '% (' + good + ' of ' + tot + ' items)' : 'No items yet', ok: tot === 0 || good / tot >= 0.999 },
      { id: 'NFR8', check: 'Data integrity', target: 'no damaged records', result: probs.length ? probs.length + ' problem(s): ' + probs.slice(0, 3).join('; ') : 'No problems found', ok: probs.length === 0 }
    ];
    UI.health = { rows: rows, t: new Date().toISOString() }; syslog(u.name, 'ran the system health checks'); save(); render();
  },
  openBackup() { if (perms(curUser()).admin) { UI.modal = { type: 'backup' }; render(); } },
  openRestore() { if (perms(curUser()).admin) { UI.modal = { type: 'restore' }; render(); } },
  copyBackup() { const t = document.getElementById('bkText'); if (!t) return; t.select(); copyText(t.value, 'Backup copied. Keep it somewhere safe.'); },
  askSettle() { UI.modal = { type: 'confirm', title: 'Mark all as settled?', text: 'This closes the current shared expenses. Do this after everyone has paid each other back.', yes: 'settle', label: 'Mark settled' }; render(); },
  claim(el) {
    const u = curUser(), h = curHH(u); if (!perms(u).use) return;
    const s = h.shopping.find(x => x.id === el.dataset.id); if (!s || (s.assignee && s.assignee !== u.id)) return;
    s.assignee = s.assignee === u.id ? '' : u.id; save(); render();
  },
  suggestExpiry() {
    const form = document.querySelector('.modal form'), hint = document.getElementById('expHint'); if (!form || !hint) return;
    const c = form.elements.category.value, l = form.elements.location.value, d = typicalDays(c, l);
    if (!d) { hint.textContent = 'No typical shelf life for this category. Please read the date on the pack.'; return; }
    form.elements.expiry.value = plusDays(d);
    hint.textContent = 'Typical for ' + c + ' kept in ' + l + ': about ' + d + ' days. This is only an estimate, so check the pack.';
  },
  async scan() {
    const box = document.getElementById('scanBox'), msg = document.getElementById('lookupMsg');
    if (!box) return;
    if (scan) { stopScan(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const video = document.createElement('video'); video.setAttribute('playsinline', ''); video.muted = true; video.srcObject = stream; await video.play();
      box.hidden = false; box.appendChild(video); msg.textContent = 'Point the camera at the barcode.';
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
      scan = { stream: stream, raf: 0 };
      const tick = async () => {
        if (!scan) return;
        try { const r = await det.detect(video); if (r.length) { const form = document.querySelector('.modal form'); if (form) form.elements.barcode.value = r[0].rawValue; stopScan(); acts.lookup(); return; } } catch (e) { /* keep trying */ }
        if (scan) scan.raf = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) { stopScan(); if (msg) msg.textContent = 'The camera is not available here. Type the barcode instead.'; }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = acts[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const fn = forms[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { UI.q = e.target.value; refreshInv(); }
});
document.addEventListener('change', e => {
  const t = e.target, u = curUser(), h = curHH(u);
  if (u && perms(u).sys && t.dataset.adminRole) {
    const m = DB.users.find(x => x.id === t.dataset.adminRole);
    if (m && m.householdId) {
      const mgrs = DB.users.filter(x => x.householdId === m.householdId && x.role === 'manager');
      if (m.role === 'manager' && t.value !== 'manager' && mgrs.length < 2) { toast('A household needs at least one Home Manager.'); render(); return; }
      m.role = t.value; syslog(u.name, 'changed the role of ' + m.name + ' to ' + ROLE_LABEL[m.role]); save(); render(); toast(m.name + ' is now ' + ROLE_LABEL[m.role] + '.');
    }
  }
  else if (u && perms(u).sys && t.dataset.adminSys) {
    const m = DB.users.find(x => x.id === t.dataset.adminSys);
    if (m && m.id !== u.id) { m.sysAdmin = t.checked; syslog(u.name, (m.sysAdmin ? 'made ' : 'removed System Administrator rights from ') + m.name + (m.sysAdmin ? ' a System Administrator' : '')); save(); render(); }
  }
  else if (u && perms(u).sys && t.dataset.config === 'source') { DB.config.source = t.value; syslog(u.name, 'set the barcode data source to ' + (t.value === 'manual' ? 'manual entry only' : 'custom products and sample catalog')); save(); render(); toast('Data source updated.'); }
  else if (t.id === 'logHH') { UI.logHH = t.value; render(); }
  else if (t.id === 'sfilter') { UI.sfilter = t.value; render(); }
  else if (t.id === 'chartItem') { UI.chartItem = t.value; render(); }
  else if (u && h && t.dataset.assign && perms(u).list) { const s = h.shopping.find(x => x.id === t.dataset.assign); if (s) { s.assignee = t.value; save(); render(); } }
  else if (t.id === 'loc') { UI.loc = t.value; refreshInv(); }
  else if (t.id === 'stat') { UI.stat = t.value; refreshInv(); }
  else if (t.id === 'sort') { UI.sort = t.value; refreshInv(); }
  else if (u && h && t.dataset.setting && perms(u).admin) {
    const k = t.dataset.setting;
    if (k === 'alertDays') h.settings.alertDays = Math.min(14, Math.max(1, Math.round(Number(t.value) || 3)));
    else if (k === 'autoList') h.settings.autoList = t.checked;
    else if (k === 'budget') h.settings.budget = Math.max(0, Number(t.value) || 0);
    addLog(h, u, 'settings', null, 0, 'changed household settings'); save(); render(); toast('Settings saved.');
  } else if (u && h && t.dataset.roleUser && perms(u).admin) {
    const m = DB.users.find(x => x.id === t.dataset.roleUser);
    if (m && m.id !== u.id && m.householdId === h.id) { m.role = t.value; addLog(h, u, 'member', null, 0, 'changed ' + m.name + ' to ' + ROLE_LABEL[m.role]); save(); render(); toast(m.name + ' is now ' + ROLE_LABEL[m.role] + '.'); }
  } else if (u && h && t.dataset.shopqty && perms(u).list) {
    const s = h.shopping.find(x => x.id === t.dataset.shopqty), v = Number(t.value);
    if (s && v > 0) { s.qty = v; save(); render(); } else render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal) { UI.modal = null; render(); }
  else if (e.key === 'Enter' && e.target && e.target.name === 'barcode') { e.preventDefault(); acts.lookup(); }
});

render();
})();

</script>
</body>
</html>
